name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Job 1: manage version + Release PR + tag/release
  release-please:
    runs-on: self-hosted
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple

  # Job 2: only runs when a release was actually created (Release PR merged)
  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: image_tag
        shell: powershell
        run: |
          $TagName = "${{ needs.release-please.outputs.tag_name }}"
          $Semver = $TagName.TrimStart("v")
          $ShortSha = "${{ github.sha }}".Substring(0, 7)
          $ImageTag = "$Semver-$ShortSha"
          "image_tag=$ImageTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Tag: $TagName"
          Write-Host "Docker image tag: $ImageTag"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/test_cicd:${{ steps.image_tag.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/test_cicd:latest
