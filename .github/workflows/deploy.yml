name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  IMAGE_NAME: test_cicd
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_USERNAME }}/test_cicd

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semver and create git tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          release_branches: main
          default_bump: false

      - name: Compute Docker image tag
        id: image_tag
        shell: bash
        run: |
          set -e

          NEW_TAG="${{ steps.tag_version.outputs.new_tag }}"
          SEMVER="${NEW_TAG#v}"
          SHORT_SHA="$(echo $GITHUB_SHA | cut -c1-7)"
          IMAGE_TAG="${SEMVER}-${SHORT_SHA}"

          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Git tag: ${NEW_TAG}"
          echo "Docker image tag: ${IMAGE_TAG}"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ steps.image_tag.outputs.image_tag }}
            ${{ env.DOCKERHUB_REPO }}:latest

      - name: Print deploy summary
        run: |
          echo "Pushed Docker image:"
          echo "${{ env.DOCKERHUB_REPO }}:${{ steps.image_tag.outputs.image_tag }}"
          echo "${{ env.DOCKERHUB_REPO }}:latest"
