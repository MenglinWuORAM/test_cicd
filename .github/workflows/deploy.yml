name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  IMAGE_NAME: test_cicd
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_USERNAME }}/test_cicd

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semver and create git tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          release_branches: main
          default_bump: false

      - name: Compute Docker image tag
        id: image_tag
        shell: pwsh
        run: |
          $NewTag = "${{ steps.tag_version.outputs.new_tag }}"
          $Semver = $NewTag.TrimStart("v")
          $ShortSha = "${{ github.sha }}".Substring(0, 7)
          $ImageTag = "$Semver-$ShortSha"

          "new_tag=$NewTag" >> $env:GITHUB_OUTPUT
          "semver=$Semver" >> $env:GITHUB_OUTPUT
          "short_sha=$ShortSha" >> $env:GITHUB_OUTPUT
          "image_tag=$ImageTag" >> $env:GITHUB_OUTPUT

          Write-Host "Git tag: $NewTag"
          Write-Host "Docker image tag: $ImageTag"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ steps.image_tag.outputs.image_tag }}
            ${{ env.DOCKERHUB_REPO }}:latest

      - name: Print deploy summary
        shell: pwsh
        run: |
          Write-Host "Pushed Docker image:"
          Write-Host "${{ env.DOCKERHUB_REPO }}:${{ steps.image_tag.outputs.image_tag }}"
          Write-Host "${{ env.DOCKERHUB_REPO }}:latest"
