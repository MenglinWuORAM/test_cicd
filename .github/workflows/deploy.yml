name: Deploy
 
on:
  push:
    branches: [main]              
    
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
 
      - name: Build production image
        run: docker build --target base -t test_cicd:${{ github.sha }} .
 
      - name: Simulate deploy
        run: |
          echo "Deploying image test_cicd:${{ github.sha }} ..."
          echo "(this is where push-to-registry / handoff-to-ops would happen)"
          echo "Deploy simulated successfully."
 
