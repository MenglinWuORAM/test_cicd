name: Deploy
on:
  push:
    branches: [main]
env:
  IMAGE_NAME: oram-main

# Default running on powershell.
defaults:
  run:
    shell: powershell

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from dev tag
        id: ver
        run: |
          $Version = git describe --tags --abbrev=0 --match "v*"
          if ([string]::IsNullOrWhiteSpace($Version)) {
            Write-Error "No version tag reachable. Was the dev version-bump job skipped?"
            exit 1
          }
          $ShortSha = "${{ github.sha }}".Substring(0, 7)
          $ImageTag = "$Version-$ShortSha"
          "version=$Version"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "image_tag=$ImageTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved version: $Version"
          Write-Host "Docker image tag: $ImageTag"

      - name: Build production image
        run: docker build --target prod -t "${env:IMAGE_NAME}:${{ steps.ver.outputs.image_tag }}" -t "${env:IMAGE_NAME}:latest" .

      - name: Print deploy summary
        run: |
          Write-Host "Built local images:"
          Write-Host "${env:IMAGE_NAME}:${{ steps.ver.outputs.image_tag }}"
          Write-Host "${env:IMAGE_NAME}:latest"
          Write-Host "Version (from dev): ${{ steps.ver.outputs.version }}"

  shadow-test:
    runs-on: self-hosted          
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t oram-main:shadow .
      - run: docker run --rm oram-main:shadow pytest tests
