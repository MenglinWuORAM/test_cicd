name: EOD
on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22:00 UTC, Mon-Fri
  workflow_dispatch: {}

# All steps run under Windows PowerShell on the self-hosted Windows runner.
defaults:
  run:
    shell: powershell

jobs:
  full:
    runs-on: self-hosted
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
      - name: Build test image
        run: docker build --target test -t selection-demo:eod .
      - name: Run full suite (unit + integration)
        run: docker run --rm selection-demo:eod pytest tests
