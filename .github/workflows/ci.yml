name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# Default running on powershell
defaults:
  run:
    shell: powershell

jobs:
  guard-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: self-hosted
    steps:
      - name: Reject non-dev sources
        run: |
          if ("${{ github.head_ref }}" -ne "dev") {
            Write-Error "PRs to main must come from dev"
            exit 1
          }

  selective-tests:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Build test image
        run: docker build --target test -t oram-main:test .

      - name: Select tests
        id: select
        run: |
          git fetch origin ${{ github.base_ref }}
          $Targets = python scripts/select_tests.py "origin/${{ github.base_ref }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "select_tests.py failed (exit $LASTEXITCODE)"
            exit $LASTEXITCODE
          }
          Write-Host "Selected: $Targets"
          "targets=$Targets" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append          

      - name: Run selected tests with coverage
        run: |
          $T = "${{ steps.select.outputs.targets }}"
          if ($T -eq "NONE") { Write-Host "No tests selected"; exit 0 }
          docker run --rm -v "${PWD}:/out" oram-main:test sh -c "pytest $T --cov=src --cov=scripts --cov-report=xml:/out/coverage.xml"

      - name: Diff coverage gate
        run: |
          $T = "${{ steps.select.outputs.targets }}"
          if ($T -eq "NONE") { exit 0 }
          pip install diff-cover
          git fetch origin ${{ github.base_ref }}
          diff-cover coverage.xml --compare-branch="origin/${{ github.base_ref }}" --fail-under=50 --markdown-report diff_cover.md
          $gate = $LASTEXITCODE
          if (Test-Path diff_cover.md) {
            Get-Content diff_cover.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
          exit $gate

  integration-tests:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: guard-main
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t oram-main:test .
      - run: docker run --rm oram-main:test pytest tests/integration

  version-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: self-hosted
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Update version tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          release_branches: dev
          default_update: patch
